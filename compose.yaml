# Lingkungan lokal Opsifin Print Hub yang memakai MySQL milik network opsifin-main.
#   docker compose up -d --build
#   docker compose exec app php artisan migrate
# Container berjalan dengan UID/GID host supaya file yang dibuat artisan/composer
# tidak dimiliki root. Set UID/GID di shell bila bukan 1000.
x-php: &php
  build: docker/php
  image: opsifin-print-hub-php:dev
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  volumes:
    - .:/app
  networks:
    - hub
    - opsifin-main

services:
  app:
    <<: *php
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"

  queue-worker:
    <<: *php
    command: php artisan queue:work database --queue=default --sleep=1 --tries=1 --timeout=60 --max-time=3600

  scheduler:
    <<: *php
    command: php artisan schedule:work

networks:
  hub:
  opsifin-main:
    external: true
    name: opsifin-main-networks
